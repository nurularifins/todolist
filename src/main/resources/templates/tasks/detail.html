<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${task.title} + ' | TodoList'">Task Detail | TodoList</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Breadcrumb -->
    <nav class="mb-4">
        <ol class="flex items-center space-x-2 text-sm">
            <li><a th:href="@{/tasks}" class="text-primary-600 hover:text-primary-800">Tasks</a></li>
            <li><span class="text-gray-400">/</span></li>
            <li class="text-gray-600" th:text="${task.title}">Task Title</li>
        </ol>
    </nav>

    <!-- Success Message -->
    <!-- Toast Notification -->
    <!-- Toast Notification -->
    <div th:if="${success}"
         x-data="{ show: true }"
         x-init="setTimeout(() => show = false, 4000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform -translate-y-2"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-300"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform -translate-y-2"
         style="display: none;"
         class="fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span th:text="${success}" class="font-medium">Success message</span>
        <button @click="show = false" class="ml-2 hover:bg-green-600 rounded-full p-1 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <!-- Task Card -->
    <div class="bg-white rounded-lg shadow">
        <!-- Header -->
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-start justify-between">
                <div>
                    <h1 th:class="'text-2xl font-bold ' + (${task.status != null && task.status.name() == 'DONE'} ? 'line-through text-gray-500' : 'text-gray-900')"
                        th:text="${task.title}">Task Title</h1>

                    <div class="flex items-center gap-3 mt-3">
                        <!-- Status Badge -->
                        <span th:if="${task.status}"
                              th:class="'px-3 py-1 text-sm font-medium rounded-full ' +
                              (${task.status.name() == 'DONE'} ? 'bg-green-100 text-green-800' :
                               (${task.status.name() == 'IN_PROGRESS'} ? 'bg-blue-100 text-blue-800' :
                               'bg-gray-100 text-gray-800'))"
                              th:text="${task.status.displayName}">Status</span>

                        <!-- Fallback for no status -->
                        <span th:unless="${task.status}" class="px-3 py-1 text-sm font-medium rounded-full bg-gray-100 text-gray-500">No Status</span>

                        <!-- Priority Badge -->
                        <span th:if="${task.priority}"
                              th:class="'px-3 py-1 text-sm font-medium rounded-full ' +
                              (${task.priority.name() == 'URGENT'} ? 'bg-red-100 text-red-800' :
                               (${task.priority.name() == 'HIGH'} ? 'bg-orange-100 text-orange-800' :
                               (${task.priority.name() == 'MEDIUM'} ? 'bg-yellow-100 text-yellow-800' :
                               'bg-green-100 text-green-800')))"
                              th:text="${task.priority.displayName}">Priority</span>

                        <!-- Fallback for no priority -->
                        <span th:unless="${task.priority}" class="px-3 py-1 text-sm font-medium rounded-full bg-gray-100 text-gray-500">No Priority</span>
                    </div>
                </div>

                <!-- Actions -->
                <!-- Actions -->
                <div class="flex items-center gap-3">
                    <!-- Edit Button (Secondary/Outline) -->
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}"
                       class="flex items-center gap-2 border border-gray-300 hover:border-primary-500 hover:text-primary-600 text-gray-700 px-4 py-2 rounded-lg transition-all text-sm font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                        Edit
                    </a>

                    <!-- Mark Complete (Primary) -->
                    <form th:if="${task.status != null && task.status.name() != 'DONE'}"
                          th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit"
                                class="flex items-center gap-2 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg transition-all text-sm font-medium shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                            Mark Complete
                        </button>
                    </form>

                    <!-- Delete (Danger/Ghost) -->
                    <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="inline"
                          onsubmit="return confirm('Are you sure you want to delete this task?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit"
                                class="flex items-center gap-2 bg-white border border-red-200 text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg transition-all text-sm font-medium">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="p-6">
            <!-- Description -->
            <div th:if="${task.description}" class="mb-6">
                <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Description</h3>
                <p class="text-gray-700 whitespace-pre-wrap" th:text="${task.description}">Description content</p>
            </div>

            <!-- Details -->
            <div class="grid grid-cols-2 gap-6">
                <div th:if="${task.dueDate}">
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Due Date</h3>
                    <p class="text-gray-900" th:text="${#temporals.format(task.dueDate, 'EEEE, MMMM dd, yyyy HH:mm')}">Due Date</p>
                </div>

                <div th:if="${task.completedAt}">
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Completed At</h3>
                    <p class="text-gray-900" th:text="${#temporals.format(task.completedAt, 'EEEE, MMMM dd, yyyy HH:mm')}">Completed At</p>
                </div>



                <div th:if="${task.createdAt}">
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Created</h3>
                    <p class="text-gray-900" th:text="${#temporals.format(task.createdAt, 'MMM dd, yyyy HH:mm')}">Created At</p>
                </div>

                <div th:if="${task.updatedAt}">
                    <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Last Updated</h3>
                    <p class="text-gray-900" th:text="${#temporals.format(task.updatedAt, 'MMM dd, yyyy HH:mm')}">Updated At</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Back Link -->
    <div class="mt-4">
        <a th:href="@{/tasks}" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900 transition-all text-sm font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Back to Tasks
        </a>
    </div>
</div>
</body>
</html>
