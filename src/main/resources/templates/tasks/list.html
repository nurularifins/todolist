<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:with="pageTitle='Todo List'">
<head>
    <title>Tasks</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Header Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <!-- Date / Title -->
        <div class="flex items-center gap-2">
            <h2 class="text-xl font-bold text-gray-800" th:text="${#temporals.format(#temporals.createNow(), 'MMMM d, yyyy')}">Feb 21, 2025</h2>
            <svg class="w-5 h-5 text-gray-500 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </div>

        <!-- Search & Add -->
        <div class="flex items-center gap-4 flex-1 md:justify-end">
            <form th:action="@{/tasks}" method="get" class="relative group w-full md:w-80">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" name="search" th:value="${searchQuery}" placeholder="Search List"
                       class="w-full pl-10 pr-10 py-2.5 rounded-xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-blue-500 bg-white transition-all shadow-sm group-hover:shadow text-sm">

                <!-- Clear Button -->
                <a th:if="${not #strings.isEmpty(searchQuery)}" th:href="@{/tasks}"
                   class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </a>
            </form>

            <a th:href="@{/tasks/new}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-blue-200 transition-all hover:scale-105 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add New List
            </a>
        </div>
    </div>

    <!-- Tabs -->
    <div class="mb-6 border-b border-gray-100">
        <div class="flex gap-8">
            <a th:href="@{/tasks(status='TODO,IN_PROGRESS')}"
               class="pb-3 border-b-2 font-medium text-sm transition-colors"
               th:classappend="${currentStatus == null or currentStatus != 'DONE'} ? 'border-gray-800 text-gray-800' : 'border-transparent text-gray-400 hover:text-gray-600'">
                Active Task
            </a>
            <a th:href="@{/tasks(status='DONE')}"
               class="pb-3 border-b-2 font-medium text-sm transition-colors"
               th:classappend="${currentStatus == 'DONE'} ? 'border-gray-800 text-gray-800' : 'border-transparent text-gray-400 hover:text-gray-600'">
                Completed
            </a>
        </div>
    </div>

    <!-- Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-6">

        <!-- Card Item -->
        <div th:each="task, iterStat : ${tasks}"
             class="relative group rounded-2xl p-6 transition-all duration-200 hover:shadow-lg"
             th:classappend="${
                (iterStat.index % 4 == 0) ? 'bg-blue-100/80 hover:bg-blue-100' :
                (iterStat.index % 4 == 1) ? 'bg-purple-100/80 hover:bg-purple-100' :
                (iterStat.index % 4 == 2) ? 'bg-orange-100/80 hover:bg-orange-100' :
                'bg-pink-100/80 hover:bg-pink-100'
             }">

            <!-- Three dots menu -->
            <div class="flex justify-between items-start mb-3">
                <div class="form-check flex items-center gap-3">
                     <!-- Checkbox for quick complete -->
                     <form th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post" th:if="${task.status.name() != 'DONE'}">
                         <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                         <button type="submit" class="w-6 h-6 rounded border-2 border-white/50 bg-white/30 flex items-center justify-center hover:bg-white/60 transition-colors">
                            <span class="sr-only">Complete</span>
                         </button>
                     </form>
                     <div th:if="${task.status.name() == 'DONE'}" class="w-6 h-6 rounded bg-green-500/20 text-green-700 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                     </div>

                     <a th:href="@{/tasks/{id}(id=${task.id})}" class="font-bold text-gray-800 text-lg hover:underline truncate max-w-[180px]" th:text="${task.title}">Task Title</a>
                </div>

                <!-- Dropdown -->
                <div x-data="{ open: false }" class="relative">
                    <button @click="open = !open" class="text-gray-500 hover:text-gray-800 p-1 rounded-full hover:bg-black/5">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/>
                        </svg>
                    </button>
                    <!-- Formatting: fixed menu -->
                    <div x-show="open" x-cloak @click.away="open = false"
                         class="absolute right-0 mt-2 w-32 bg-white rounded-lg shadow-xl z-10 py-1 border border-gray-100">
                        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Edit</a>
                        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50" onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Description -->
            <p class="text-sm text-gray-600 mb-6 leading-relaxed line-clamp-3 h-[4.5em]" th:text="${task.description ?: 'No description provided.'}">
                Lorem ipsum dolor sit amet, consectetur elit lddv nlorem idjsfjfj.
            </p>

            <!-- Footer: Time -->
            <div class="flex items-center text-xs font-semibold text-gray-500 bg-white/40 px-3 py-1.5 rounded-lg w-fit">
                <span th:if="${task.dueDate}" th:text="${#temporals.format(task.dueDate, 'MMM d, hh:mm a')}">Dec 20, 10:30 AM</span>
                <span th:unless="${task.dueDate}">No Due Date</span>
            </div>

        </div>

    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(tasks)}" class="text-center py-20">
        <p class="text-gray-500 text-lg">No tasks found. Create one to get started!</p>
    </div>

</div>
</body>
</html>
