<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Edit Profile | HealDocs</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Breadcrumb -->
    <nav class="mb-6">
        <ol class="flex items-center space-x-2 text-sm text-gray-500">
            <li><a th:href="@{/dashboard}" class="text-blue-600 hover:text-blue-800 font-medium">Home</a></li>
            <li><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><a th:href="@{/profile}" class="text-blue-600 hover:text-blue-800 font-medium">My Profile</a></li>
            <li><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li class="text-gray-900 font-semibold">Edit Profile</li>
        </ol>
    </nav>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 max-w-3xl overflow-hidden">
        <div class="p-8 pb-0">
            <h1 class="text-2xl font-bold text-gray-800">Edit Profile</h1>
            <p class="mt-1 text-sm text-gray-500">Update your personal information below.</p>
        </div>

        <form th:action="@{/profile/edit}" method="post" th:object="${userProfileDto}" class="p-8 pt-0 space-y-6">

            <!-- Errors -->
            <div th:if="${error}" class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span th:text="${error}">Error message</span>
            </div>

            <!-- Full Name -->
            <div>
                <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-1">
                    Full Name <span class="text-red-500">*</span>
                </label>
                <input type="text" id="fullName" th:field="*{fullName}"
                       class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-gray-400 text-sm"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-500 focus:ring-red-500'"
                       placeholder="Enter your full name">
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-1 text-xs text-red-600">Error</p>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-100">
                <a th:href="@{/profile}"
                   class="px-4 py-2 border border-gray-200 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-800 transition-all">
                    Cancel
                </a>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 shadow-md shadow-blue-200 transition-all hover:scale-[1.02] active:scale-[0.98]">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
