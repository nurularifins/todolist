<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Dashboard</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Welcome Banner -->
    <div class="bg-gradient-to-r from-primary-600 to-yellow-200 rounded-2xl p-8 mb-8 text-white shadow-lg relative overflow-hidden">
        <div class="relative z-10">
            <h1 class="text-3xl font-bold mb-2">Welcome back, <span th:text="${user.fullName}">User</span>!</h1>
            <p class="text-white/90 text-lg">Here's what's happening with your tasks today.</p>
        </div>
        <!-- Decorative Circle -->
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
        <div class="absolute bottom-0 right-20 -mb-10 w-32 h-32 bg-primary-400 opacity-20 rounded-full blur-xl"></div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Total Tasks -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Total Tasks</h3>
                <div class="p-2 bg-blue-50 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                </div>
            </div>
            <p class="text-3xl font-bold text-gray-900" th:text="${totalTasks}">0</p>
        </div>

        <!-- Completed Tasks -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Completed</h3>
                <div class="p-2 bg-green-50 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>
            <p class="text-3xl font-bold text-gray-900" th:text="${completedTasks}">0</p>
        </div>

        <!-- Pending Tasks -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Pending</h3>
                <div class="p-2 bg-orange-50 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-orange-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>
            <p class="text-3xl font-bold text-gray-900" th:text="${pendingTasks}">0</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <h2 class="text-xl font-bold text-gray-800 mb-4">Quick Actions</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <a href="/tasks/new" class="group bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:border-primary-500 hover:shadow-md transition-all flex items-center gap-4">
            <div class="p-3 bg-primary-50 rounded-full group-hover:bg-primary-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary-600 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <div>
                <h3 class="font-semibold text-gray-900 group-hover:text-primary-600 transition-colors">Create New Task</h3>
                <p class="text-sm text-gray-500">Add a new item to your list</p>
            </div>
        </a>

        <a href="/tasks" class="group bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:border-primary-500 hover:shadow-md transition-all flex items-center gap-4">
            <div class="p-3 bg-indigo-50 rounded-full group-hover:bg-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
            </div>
            <div>
                <h3 class="font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors">View All Tasks</h3>
                <p class="text-sm text-gray-500">Manage your existing tasks</p>
            </div>
        </a>

        <a href="/profile" class="group bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:border-primary-500 hover:shadow-md transition-all flex items-center gap-4">
            <div class="p-3 bg-purple-50 rounded-full group-hover:bg-purple-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
            <div>
                <h3 class="font-semibold text-gray-900 group-hover:text-purple-600 transition-colors">My Profile</h3>
                <p class="text-sm text-gray-500">Update your account settings</p>
            </div>
        </a>
    </div>

</div>
</body>
</html>
