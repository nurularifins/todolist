<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | TodoList">TodoList</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flatpickr (Material Blue Theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
    <th:block layout:fragment="head"></th:block>
</head>
<body class="bg-gray-50 min-h-screen flex" x-data="{ sidebarOpen: false }">

    <!-- Sidebar (Visible only when authenticated) -->
    <div sec:authorize="isAuthenticated()">
        <nav th:replace="~{layout/fragments :: sidebar}"></nav>

        <!-- Mobile Overlay -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false"
             x-transition:enter="transition-opacity ease-linear duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-linear duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-gray-600 bg-opacity-75 z-40 md:hidden" x-cloak></div>
    </div>

    <!-- Main Content Wrapper -->
    <div th:class="${#authorization.expression('isAuthenticated()') ? 'flex-1 md:ml-64 flex flex-col min-h-screen' : 'flex-1 flex flex-col min-h-screen'}">

        <!-- Top Header (Authenticated) -->
        <th:block sec:authorize="isAuthenticated()">
            <header th:replace="~{layout/fragments :: top-header(title=${pageTitle ?: 'TodoList'})}"></header>
        </th:block>

        <!-- Public Navbar (Unauthenticated) -->
        <th:block sec:authorize="!isAuthenticated()">
             <nav th:replace="~{layout/fragments :: public-navbar}"></nav>
        </th:block>

        <!-- Common Content Area -->
        <main class="flex-1 p-4 md:p-8">
             <div layout:fragment="content"></div>
             <!-- Public content fallback can be handled by the template itself if needed, or by layout:fragment="public-content" if distinct -->
        </main>

    </div>

    <!-- Alpine.js (Moved to end for better loading) -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
