<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Sidebar Fragment -->
<nav th:fragment="sidebar"
     class="bg-white w-64 min-h-screen border-r border-gray-200 fixed left-0 top-0 flex flex-col z-50 transition-transform duration-300 transform -translate-x-full md:translate-x-0"
     :class="{ 'translate-x-0': sidebarOpen }">
    <!-- Logo -->
    <div class="px-6 h-16 flex items-center border-b border-gray-100 justify-between">
        <a th:href="@{/}" class="flex items-center gap-2">
            <svg class="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-1.07 3.97-2.9 5.4z"/>
            </svg>
            <span class="text-xl font-bold text-gray-800 tracking-tight">HealDocs</span>
        </a>
        <!-- Close Button (Mobile) -->
        <button @click="sidebarOpen = false" class="md:hidden text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div class="flex-1 py-6 space-y-1 overflow-y-auto px-3">

        <p class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Main</p>

        <!-- Dashboard Link -->
        <a th:href="@{/dashboard}"
           class="group flex items-center px-3 py-2 text-sm font-medium rounded-lg transition-colors"
           th:classappend="${requestURI == '/dashboard' ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'}">
           <svg class="mr-3 flex-shrink-0 h-5 w-5 transition-colors"
                th:classappend="${requestURI == '/dashboard' ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
           </svg>
           Overview
        </a>

        <!-- Todo List Link -->
        <a th:href="@{/tasks}"
           class="group flex items-center px-3 py-2 text-sm font-medium rounded-lg transition-colors"
           th:classappend="${requestURI != null and requestURI.startsWith('/tasks') ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'}">
            <svg class="mr-3 flex-shrink-0 h-5 w-5 transition-colors"
                 th:classappend="${requestURI != null and requestURI.startsWith('/tasks') ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}"
                 xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            Todo List
        </a>

        <!-- Submenu Simulation (Visible only in Todo List) -->
        <div class="pl-10 space-y-1" th:if="${requestURI != null and requestURI.startsWith('/tasks')}">
            <a href="#" class="block text-sm text-gray-500 hover:text-gray-900 py-1">Team Meeting</a>
            <a href="#" class="block text-sm text-gray-500 hover:text-gray-900 py-1">Work on Branding</a>
            <a href="#" class="block text-sm text-gray-500 hover:text-gray-900 py-1">Make a Report</a>
        </div>
    </div>

    <!-- User Profile -->
    <div class="border-t border-gray-200 p-4">
        <a th:href="@{/profile}" class="flex items-center w-full hover:bg-gray-50 p-2 rounded-lg transition-colors">
            <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm">
                <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
            </div>
            <div class="ml-3">
                <p class="text-sm font-medium text-gray-700 max-w-[140px] truncate" sec:authentication="name">User Name</p>
                <p class="text-xs text-gray-500">View Profile</p>
            </div>
        </a>
    </div>
</nav>

<!-- Top Navbar Fragment (Authenticated) -->
<nav th:fragment="top-header(title)" class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-4 md:px-8 sticky top-0 z-30">
    <!-- Left: Hamburger & Title -->
    <div class="flex items-center gap-4">
        <!-- Hamburger Menu -->
        <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-gray-700 md:hidden focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <h1 class="text-xl font-bold text-gray-800" th:text="${title}">Page Title</h1>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-6">
        <!-- Notification -->
        <button class="relative p-2 text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="absolute top-2 right-2 h-2 w-2 bg-red-500 rounded-full border border-white"></span>
        </button>

        <!-- User Avatar & Menu -->
        <div class="relative" x-data="{ open: false }">
            <button type="button" @click="open = !open" @click.away="open = false" class="flex items-center gap-3 focus:outline-none">
                <img class="h-8 w-8 rounded-full object-cover border border-gray-200"
                     th:src="@{'https://ui-avatars.com/api/?name=' + ${#authentication.name} + '&background=random'}"
                     alt="User">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <!-- Dropdown Menu -->
            <div x-show="open"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="transform opacity-100 scale-100"
                 x-transition:leave-end="transform opacity-0 scale-95"
                 class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50 origin-top-right"
                 x-cloak>

                <div class="px-4 py-3 border-b border-gray-50">
                    <p class="text-sm text-gray-900 font-semibold truncate" sec:authentication="name">User</p>
                </div>

                <a th:href="@{/profile}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Your Profile</a>

                <form th:action="@{/logout}" method="post" class="block">
                    <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 hover:text-red-700">
                        Sign out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Public Navbar Fragment -->
<nav th:fragment="public-navbar" class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a th:href="@{/}" class="flex items-center gap-2">
                    <svg class="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-1.07 3.97-2.9 5.4z"/>
                    </svg>
                    <span class="text-xl font-bold text-gray-800 tracking-tight">HealDocs</span>
                </a>
            </div>
            <div class="flex items-center space-x-4">
                <a th:href="@{/login}" class="text-gray-600 hover:text-blue-600 font-medium">Login</a>
                <a th:href="@{/register}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Register</a>
            </div>
        </div>
    </div>
</nav>
